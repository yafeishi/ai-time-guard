<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>专注倒计时</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090d18;color:#edf2ff;font-family:system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center}main{width:min(90vw,900px)}h1{font-size:clamp(24px,4vw,48px);font-weight:500;color:#b5c2e3}#time{font-size:clamp(80px,20vw,230px);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.05em}p{color:#9faecf;line-height:1.7}button{padding:14px 24px;border:1px solid #34435f;border-radius:12px;background:#142039;color:#edf2ff;font-size:16px;margin:8px;cursor:pointer}#start{background:#5668dd}#exit{position:fixed;top:16px;right:16px}#status{min-height:30px}progress{width:75%;height:5px;accent-color:#8292ff;border:0}#again{display:none}
</style><main><h1 id="name">专注倒计时</h1><div id="time">--:--</div><progress id="progress" max="1" value="0"></progress><p id="status">点击开始，进入全屏并开始新一轮计时</p><button id="start">全屏开始</button><button id="pause" hidden>暂停</button><button id="confirm" hidden>我已完成</button><button id="again">再来一轮</button><p id="hint">Esc 可退出全屏。退出展示后，事件计时仍继续。专注期间应用的其他弹窗暂缓。</p></main><button id="exit">退出专注</button>
<script>
const id=new URLSearchParams(location.search).get('id');let event=null,active=false,finishing=false;
const el=x=>document.getElementById(x);
async function command(action){const r=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id})});const result=await r.json();if(!r.ok)throw Error(result.error||'操作失败');}
async function read(){const r=await fetch('/api/events');if(!r.ok)throw Error('应用暂时无法连接，倒计时显示已保留');const d=await r.json();event=d.events.find(e=>e.id===id);if(!event)throw Error('该事件不存在，请从事件菜单重新打开');el('name').textContent=event.name;return event;}
function render(){if(!event)return;if(finishing){el("time").textContent="00:00";return;}const seconds=event.state==='paused'?event.remaining:active?Math.max(0,(event.due||Date.now()/1000)-Date.now()/1000):event.seconds;const n=Math.ceil(seconds);el('time').textContent=String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');el('progress').value=Math.max(0,Math.min(1,1-seconds/event.seconds));if(active&&seconds<=0&&event.state!=='paused')finish();}
async function begin(){try{await document.documentElement.requestFullscreen();await command('focus');await read();active=true;finishing=false;el('start').hidden=true;el('again').style.display='none';el('pause').hidden=false;el('pause').textContent='暂停';el('status').textContent='专注当前动作，其他事情稍后处理';}catch(e){el('status').textContent=e.message;}}
async function finish(){if(finishing)return;finishing=true;if(event.mode!=='once'){el('time').textContent='00:00';el('status').textContent='时间到，请在实际完成后确认';el('pause').hidden=true;el('confirm').hidden=false;return;}await complete();}
async function complete(){try{await command('complete');active=false;await command('focus_end');el('time').textContent='00:00';el('status').textContent='本轮计时结束，已记录完成';el('pause').hidden=true;el('confirm').hidden=true;el('again').style.display='inline-block';}catch(e){finishing=false;el('status').textContent=e.message;}}
el('start').onclick=begin;el('again').onclick=begin;el('confirm').onclick=complete;
el('pause').onclick=async()=>{try{await command(event.state==='paused'?'resume':'pause');await read();el('pause').textContent=event.state==='paused'?'继续':'暂停';el('status').textContent=event.state==='paused'?'已暂停':'专注当前动作，其他事情稍后处理';}catch(e){el('status').textContent=e.message;}};
async function exit(){active=false;finishing=false;el("confirm").hidden=true;try{await command('focus_end');}catch(e){el('status').textContent=e.message;}if(document.fullscreenElement)await document.exitFullscreen();el('pause').hidden=true;el('start').hidden=false;el('status').textContent='已退出专注，事件计时仍继续';}
el('exit').onclick=exit;
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&active)exit();});
window.addEventListener('pagehide',()=>{fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'focus_end',id}),keepalive:true});});
setInterval(render,200);setInterval(async()=>{try{if(active)await command('focus_heartbeat');await read();if(active&&event.state==='idle'){active=false;el('status').textContent='事件已结束';el('pause').hidden=true;} }catch(e){el('status').textContent=e.message;}},5000);
read().then(render).catch(e=>{el('status').textContent=e.message;el('start').disabled=true;});
</script></html>
